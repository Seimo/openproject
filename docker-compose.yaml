name: openproject

services:

  app:
    image: openproject/openproject:17
    restart: always
    #volumes:
    #  - openproject_data:/var/www/html:z
    environment:
      - TZ=${DEFAULT_TIME_ZONE}
      - SECRET_KEY_BASE=${OPENPROJECT_SECRET_KEY_BASE}
      - OPENPROJECT_HOST__NAME=localhost:${WEB_HTTP_PORT}
      - OPENPROJECT_HTTPS=false
      - OPENPROJECT_DEFAULT__LANGUAGE=de
    ports:
      - ${WEB_HTTP_PORT}:80
      #- ${WEB_HTTPS_PORT}:443


volumes:
  openproject_data: